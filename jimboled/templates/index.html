<!doctype html>
<html lang="en" data-theme="{{ theme }}" data-density="{{ density }}" data-radius="{{ radius }}"
      data-font="{{ font }}" data-backdrop="{{ backdrop }}" data-surface="{{ surface }}"
      data-brand="{{ brand_mode }}" data-logo-size="{{ logo_size }}"{% if logo_url %} data-has-logo{% endif %}
      style="--accent: {{ accent }}; --text-scale: {{ text_scale }}; --backdrop-dim: {{ backdrop_dim }};{% if background_url %} --backdrop-image: url('{{ background_url }}');{% endif %}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="{{ theme_color }}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>{{ title }}</title>
  <link rel="icon" id="favicon" href="{{ icon_url }}" type="{{ icon_type }}">
  <link rel="apple-touch-icon" id="touch-icon" href="{{ icon_url }}">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/static/css/app.css?v={{ version }}">
  <style id="custom-css">{{ custom_css }}</style>
</head>
<body>
  <div id="app" class="app">
    <header class="topbar" id="topbar">
      <a class="brand" href="#/" id="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <img class="brand-logo" id="brand-logo" alt=""{% if logo_url %} src="{{ logo_url }}"{% else %} hidden{% endif %}>
        <span class="brand-text"><span class="brand-title" id="brand-title">{{ title }}</span><span class="brand-sub" id="brand-sub">{{ subtitle }}</span></span>
      </a>
      <div class="topbar-status" id="topbar-status"></div>
      <nav class="topbar-actions" id="topbar-actions"></nav>
    </header>
    <main class="main" id="main"></main>
    <footer class="footer" id="footer"></footer>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="assertive"></div>
  <script>window.JIMBOLED = { version: "{{ version }}" };</script>
  <script src="/static/js/icons.js?v={{ version }}"></script>
  <script src="/static/js/api.js?v={{ version }}"></script>
  <script src="/static/js/ui.js?v={{ version }}"></script>
  <script src="/static/js/color.js?v={{ version }}"></script>
  <script src="/static/js/gpio.js?v={{ version }}"></script>
  <script src="/static/js/estop.js?v={{ version }}"></script>
  <script src="/static/js/device.js?v={{ version }}"></script>
  <script src="/static/js/lights.js?v={{ version }}"></script>
  <script src="/static/js/automation.js?v={{ version }}"></script>
  <script src="/static/js/settings.js?v={{ version }}"></script>
  <script src="/static/js/wizard.js?v={{ version }}"></script>
  <script src="/static/js/app.js?v={{ version }}"></script>
</body>
</html>
